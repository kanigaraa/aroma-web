name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # opennextjs build menjalankan next build internal, tidak perlu npm run build terpisah
      - run: npx opennextjs-cloudflare build
      - run: npx opennextjs-cloudflare upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # version terbaru = yang paling baru di-upload (urut by created_on, bukan list order)
      - name: Deploy version terbaru ke 100%
        run: |
          ID=$(npx wrangler versions list --json | node -e "
            const v = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const latest = v.sort((a, b) =>
              new Date(b.metadata.created_on) - new Date(a.metadata.created_on)
            )[0];
            console.log(latest.id);
          ")
          npx wrangler versions deploy "$ID@100%" -y
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
