name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx opennextjs-cloudflare build

      - run: npx opennextjs-cloudflare upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to production
        run: |
          VERSION_ID=$(npx wrangler versions list --json 2>/dev/null | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); const v=JSON.parse(d); console.log(v[0].id)" 2>/dev/null || echo "")
          if [ -n "$VERSION_ID" ]; then
            npx wrangler versions deploy "$VERSION_ID@100%" -y
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
